{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}QueueCare{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body>
<header class="topbar"><a class="brand" href="{% url 'home' %}"><span class="brandmark">♟</span>Queue<span>Care</span></a>
<nav><a href="{% url 'home' %}">Home</a><a href="{% url 'services' %}">Services</a><a href="{% url 'live_queue' %}">Live Queue</a><a href="{% url 'about' %}">About</a></nav>
<div class="nav-actions"><a class="btn outline" href="{% url 'staff_login' %}">Staff Login</a><a class="btn primary" href="{% url 'register_token' %}">Get Token</a></div></header>
{% if messages %}<div class="messages">{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}</div>{% endif %}
{% block content %}{% endblock %}
<footer>© {% now "Y" %} QueueCare · Smart Queue & Token Management</footer>
<script src="{% static 'js/app.js' %}"></script></body></html>
